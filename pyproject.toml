[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "epub2dataset"
version = "3.0.0"
description = "Convert EPUB ebooks into high-quality LLM training datasets"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Matrix Research AI"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "ebooklib>=0.18",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
parquet = ["pyarrow>=14.0", "pandas>=2.0"]
arrow = ["pyarrow>=14.0"]
all = ["pyarrow>=14.0", "pandas>=2.0"]

[project.scripts]
epub2dataset = "epub2dataset.cli:main"

[tool.setuptools.packages.find]
include = ["epub2dataset*"]
